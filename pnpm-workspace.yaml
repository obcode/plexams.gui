# pnpm-Settings (seit pnpm 10/11 nicht mehr im "pnpm"-Feld der package.json).
# Native Postinstall-Builds sind aus Sicherheitsgründen standardmäßig blockiert;
# hier werden die für Vite/Tailwind nötigen Pakete explizit erlaubt.
# (@sentry/cli used to be listed here as `false`. Sentry 11 dropped it from the tree; its
# successor, the `sentry` package, has no install script.)
allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true

# Security overrides for transitive dependencies whose parents ship no fixed release
# (Dependabot alerts, 2026-11-23). Each one is scoped to the parent that pins the
# vulnerable version; drop it once that parent catches up.
overrides:
  # @tailwindcss/typography (latest 0.5.20) pins postcss-selector-parser 6.0.10 exactly.
  '@tailwindcss/typography>postcss-selector-parser': ^6.1.6
  # graphql-config (also 6.0.0, the latest) wants minimatch ^10; the fix is 11.0.1.
  # Only used by `pnpm codegen`.
  'graphql-config>minimatch': ^11.0.1
  # Optional peer of vitest (declared as "*") that pnpm auto-installs; the unit tests
  # use jsdom, not happy-dom. The fix is 21.0.4.
  happy-dom: ^21.0.4
