# Dependency-Updates aktuell halten (nativ in GitHub, kein App-Setup nötig).
# Wöchentliche PRs, gruppiert, damit es nicht zerfasert. Für Auto-Merge von
# Minor/Patch wäre Renovate die stärkere Alternative (braucht die Renovate-App).
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Svelte-Ökosystem zusammen (Kit/vite-plugin/svelte müssen kompatibel sein).
      # `vite` gehört hier mit hinein und NICHT zu `tooling`: die Peer-Ranges von
      # @sveltejs/vite-plugin-svelte sind an die Vite-Major gekoppelt, ein
      # Alleingang des Plugins bricht den Dev-Server (siehe #71).
      svelte:
        patterns:
          - 'svelte'
          - '@sveltejs/*'
          - 'svelte-*'
          - 'vite'
      # Build-/Test-Toolchain zusammen
      tooling:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'eslint*'
          - 'prettier*'
          - '@playwright/*'
          - 'playwright'
      # alles übrige an Minor/Patch gebündelt
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Dockerfile-Base-Images (node:24-alpine in beiden Stages).
  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
