# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Create and publish a Docker image

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@703896b4f30f62d53f5530a80bcdc589a3f702bc
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@b9769986761dfcf8828a58eadbd440d1738476f9
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GUI-Version aus dem semantic-release-Release-Tag (z. B. v1.204.0) in
          # den Build reichen; vite.config.js liest sie als APP_VERSION.
          build-args: |
            APP_VERSION=${{ github.event.release.tag_name }}

  # Übergibt das frisch gepushte Image an den Deploy-Workflow.
  #
  # Die Deploy-Artefakte (compose, Caddyfile, deploy.sh, die Pfade auf dem Host und
  # dessen Name) liegen im PRIVATEN Repo obcode/plexams.dev — dieses hier ist öffentlich.
  # Vorher lag der Deploy-Job hier, mit einem eigenen Self-hosted-Runner je öffentlichem
  # Repo; der Dispatch ersetzt beide durch einen Runner am privaten Repo.
  #
  # Läuft auf ubuntu-latest: es ist ein AUSGEHENDER Aufruf an api.github.com und braucht
  # keinen Zugang zum VPN-internen Host.
  dispatch-deploy:
    needs: build-and-push-image
    # Gate wie AUTO_DEPLOY in plexams.dev: ohne DISPATCH_TOKEN bricht `gh api` an einem
    # leeren GH_TOKEN ab und färbt den Release-Lauf rot. Beide zusammen scharfstellen.
    if: ${{ vars.DEPLOY_DISPATCH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy in plexams.dev auslösen
        env:
          # Fine-grained PAT mit ausschließlich "contents: write" auf obcode/plexams.dev —
          # die Berechtigung, die repository_dispatch verlangt. Er kann dieses Repo nicht
          # lesen, und an einen Fork wird er nie gereicht: Secrets stehen Workflows aus
          # Fork-Pull-Requests nicht zur Verfügung.
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          # release-Event → github.ref ist refs/tags/vX.Y.Z. Das "v" MUSS bleiben:
          # docker/metadata-action taggt das Image mit dem rohen Ref (v1.97.0), wie die
          # ganze Registry-Historie — ohne v läuft der Pull in ein "not found".
          gh api repos/obcode/plexams.dev/dispatches \
            -f event_type=deploy-gui \
            -F "client_payload[tag]=${GITHUB_REF#refs/tags/}"
